name: Generate profile art

# Membuat ulang grafik kontribusi 3D dan animasi snake setiap hari.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 WITA
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-art.yml"
      - "scripts/**"

permissions:
  contents: write

# Jalankan satu per satu supaya tidak bentrok saat commit
concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Build pixel stats HUD
        run: python3 scripts/build_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib assets/stats.svg
          git commit -m "Update 3D graph & stats" || exit 0
          git pull --rebase -X theirs
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7CFC00&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
